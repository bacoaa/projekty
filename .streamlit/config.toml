# ============================================================================
# .streamlit/config.toml
# ----------------------------------------------------------------------------
# To jest OFICJALNY sposób Streamlit na ustawienie kolorystyki całej appki
# (tła, przycisków, tekstu) - DZIAŁA RAZEM z custom CSS w app.py, ale
# ustawia też rzeczy, których samym CSS nie da się łatwo "dosięgnąć"
# (np. kolor zaznaczenia w polach, suwaki, domyślne tło widgetów).
#
# PALETA: "Scandi-Forest" - stonowane, leśne barwy: mchowa biel jako tło,
# głęboka leśna zieleń jako główny akcent, ciemny, lekko zielonkawy tekst
# zamiast czystej czerni. Dopasowana do kolorów w KOLOR_* w app.py - jeśli
# zmieniasz jedno, zmień też drugie, żeby appka była spójna.
#
# WAŻNE: ten plik MUSI być w folderze dokładnie o nazwie ".streamlit"
# (z kropką na początku!) w głównym katalogu Twojego repo na GitHubie,
# obok app.py i database.py. Streamlit Cloud sam go wykryje przy starcie.
# ============================================================================
[theme]
base = "light"

# Główny kolor akcentu - przyciski "primary", suwaki, zaznaczenia, focus.
primaryColor = "#3F6B4A"

# Tło głównej treści strony - ciepła, mchowa biel.
backgroundColor = "#F7F4ED"

# Tło "drugoplanowe" - używane przez expander, pola input, karty.
secondaryBackgroundColor = "#ECE6D9"

# Kolor tekstu - głęboka, lekko zielonkawa czerń (nie czysta czerń #000).
textColor = "#2B2B23"

# Rodzina czcionek - "sans serif" każe Streamlit użyć systemowej czcionki
# bezszeryfowej jako fallback; właściwą, "ładniejszą" czcionkę (Inter)
# doczytujemy dodatkowo przez Google Fonts w CSS w app.py.
font = "sans serif"
